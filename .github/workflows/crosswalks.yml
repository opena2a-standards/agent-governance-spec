name: Crosswalks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  crosswalks:
    name: crosswalks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 --version
      - run: python3 scripts/check_crosswalks.py
