# OASB-2 Governance Scan -- GitHub Action
#
# Add this to your repo at .github/workflows/governance.yml
# Scans SOUL.md on every PR and comments with governance score.
#
# Requirements:
#   - Node.js 18+
#   - SOUL.md (or equivalent governance file) in repo root
#
# Optional: set a minimum score with the MIN_GOVERNANCE_SCORE repository
# variable (Settings > Secrets and variables > Actions > Variables), a whole
# number from 0 to 100. The job fails when the score is below it. Unset or
# empty, the minimum is 0 and the job only reports the score; any other value
# fails the job. When the scan measured nothing (no governance file, or one
# that is unreadable or empty), the job prints the reason, and fails only when
# a minimum is set. When the scanner gave no result (it could not be installed
# or started, or printed no score and no reason), the job fails whether or not
# a minimum is set.
#
# scan-result.json is uploaded as the governance-scan-result artifact, also
# when the job fails. An npm or scanner error is in the "Run governance scan"
# step log.
#
# The upload is the last step, after the pull request comment and the minimum
# score check, and a failed upload does not fail the job. It fails when the
# artifact storage quota is used up, and on GitHub Enterprise Server, which the
# README of actions/upload-artifact@v4 lists as not supported. On GitHub
# Enterprise Server, change the "Keep scan result" step to the version that
# README names for it.
#
# The scanner version is pinned in the "Run governance scan" step. To move to
# a newer release, change the version there and check the keys this job reads.

name: Agent Governance Scan

on:
  pull_request:
    branches: [main, master]
    paths:
      - 'SOUL.md'
      - 'system-prompt.md'
      - 'SYSTEM_PROMPT.md'
      - '.cursorrules'
      - '.github/copilot-instructions.md'
      - 'CLAUDE.md'
      - '.clinerules'
      - 'instructions.md'
      - 'constitution.md'
      - 'agent-config.yaml'
  push:
    branches: [main, master]
    paths:
      - 'SOUL.md'
      - 'system-prompt.md'
      - 'SYSTEM_PROMPT.md'
      - '.cursorrules'
      - '.github/copilot-instructions.md'
      - 'CLAUDE.md'
      - '.clinerules'
      - 'instructions.md'
      - 'constitution.md'
      - 'agent-config.yaml'

jobs:
  scan-soul:
    name: Behavioral Governance Scan
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run governance scan
        id: scan
        run: |
          # Pinned: a new scanner release changes the result only through a commit here.
          npx hackmyagent@0.33.2 scan-soul --json > scan-result.json || true
          # A run that measured nothing (exit code 2) has a null score, left empty
          # here, and gate.reason names the case.
          SCORE=$(jq -r '.score // ""' scan-result.json 2>/dev/null || true)
          GRADE=$(jq -r '.grade // "F"' scan-result.json 2>/dev/null || true)
          CONFORMANCE=$(jq -r '.conformance // "NONE"' scan-result.json 2>/dev/null || true)
          FILE=$(jq -r '.file // "none"' scan-result.json 2>/dev/null || true)
          REASON=$(jq -r '.gate.reason // ""' scan-result.json 2>/dev/null || true)
          # jq prints nothing and exits 0 on an empty file, so a default is applied
          # to an empty value as well as to a file that is not JSON.
          {
            echo "score=$SCORE"
            echo "grade=${GRADE:-F}"
            echo "conformance=${CONFORMANCE:-NONE}"
            echo "file=${FILE:-none}"
            echo "reason=$REASON"
          } >> "$GITHUB_OUTPUT"

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          SCORE: ${{ steps.scan.outputs.score }}
          GRADE: ${{ steps.scan.outputs.grade }}
          CONFORMANCE: ${{ steps.scan.outputs.conformance }}
          FILE: ${{ steps.scan.outputs.file }}
          REASON: ${{ steps.scan.outputs.reason }}
        with:
          script: |
            // The scan outputs arrive through env:, so no value is pasted into this source.
            const { SCORE: score, GRADE: grade, CONFORMANCE: conformance, FILE: file, REASON: reason } = process.env;
            const fs = require('fs');

            const scoreLine = score
              ? `**Score:** ${score}/100 (Grade: ${grade})`
              : `**Score:** not measured (\`${reason || 'no score in scan-result.json'}\`)`;

            let domainTable = '';
            try {
              const result = JSON.parse(fs.readFileSync('scan-result.json', 'utf8'));
              // domains is an array: one { domain, passed, total, percentage } per domain.
              if (Array.isArray(result.domains) && result.domains.length > 0) {
                domainTable = '\n| Domain | Score | Status |\n|--------|-------|--------|\n';
                for (const d of result.domains) {
                  // A domain the agent profile leaves out has no controls to score.
                  if (d.skippedByProfile === true) {
                    domainTable += `| ${d.domain} | Skipped by profile | Not applicable |\n`;
                    continue;
                  }
                  const pct = d.percentage;
                  const status = pct >= 75 ? 'Pass' : pct >= 50 ? 'Partial' : 'Needs work';
                  domainTable += `| ${d.domain} | ${d.passed}/${d.total} (${pct}%) | ${status} |\n`;
                }
              }
            } catch {}

            // The comment this workflow wrote is the one with this marker and this author.
            // The default GITHUB_TOKEN posts as github-actions[bot]; change the author if
            // you pass another token through github-token. A comment posted by an earlier
            // version of this example has no marker, so the first run after an update
            // posts a new comment, and later runs update that one.
            const marker = '<!-- agent-governance-scan -->';
            const author = 'github-actions[bot]';

            const body = `${marker}
            ## Agent Governance Scan

            ${scoreLine}
            **Conformance:** ${conformance}
            **File:** \`${file}\`
            ${domainTable}

            *Scanned with [HackMyAgent](https://github.com/opena2a-org/hackmyagent) against the [Agent Behavioral Governance Specification](https://github.com/opena2a-org/agent-governance-spec).*

            To improve your score: \`npx hackmyagent harden-soul\`
            `.replace(/            /g, '');

            // Update the comment this workflow wrote, on whichever page it is, or create one.
            // A comment by anyone else is left as it is, whatever its text.
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(c => c.user && c.user.login === author && (c.body || '').includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Check minimum score
        if: always()
        env:
          SCORE: ${{ steps.scan.outputs.score }}
          REASON: ${{ steps.scan.outputs.reason }}
          MIN_SCORE: ${{ vars.MIN_GOVERNANCE_SCORE || '0' }}
        run: |
          case "$MIN_SCORE" in
            ''|*[!0-9]*)
              echo "MIN_GOVERNANCE_SCORE must be a whole number, got '$MIN_SCORE'"
              exit 1
              ;;
            [0-9]|[0-9][0-9]|0[0-9][0-9]|100)
              ;;
            0[0-9][0-9][0-9]*)
              # A leading zero and more than three digits: not compared, whatever the number is.
              echo "MIN_GOVERNANCE_SCORE must be from 0 to 100 in at most three digits, got '$MIN_SCORE'"
              exit 1
              ;;
            *)
              # Above 100, the highest score. `[` cannot read a number too long for the
              # shell: the comparison below would be false, and any score would pass.
              echo "MIN_GOVERNANCE_SCORE must be 100 or less, got '$MIN_SCORE'"
              exit 1
              ;;
          esac
          # gate.reason first: a run that measured nothing has no score to compare.
          case "$REASON" in
            no-governance-file) NOT_MEASURED="no governance file was found" ;;
            governance-file-unreadable) NOT_MEASURED="the governance file could not be read" ;;
            governance-file-empty) NOT_MEASURED="the governance file is empty" ;;
            *) NOT_MEASURED="" ;;
          esac
          # No score and none of those reasons: the scanner did not run, or printed no result to read.
          case "$SCORE" in
            ''|*[!0-9]*)
              if [ -z "$NOT_MEASURED" ]; then
                echo "Nothing was measured: the scan reported no score; see the governance-scan-result artifact and the \"Run governance scan\" step log (gate.reason: ${REASON:-none})."
                echo "The scanner gave no result, so the job fails whether or not a minimum is set."
                exit 1
              fi
              ;;
          esac
          if [ -n "$NOT_MEASURED" ]; then
            echo "Nothing was measured: $NOT_MEASURED (gate.reason: ${REASON:-none})."
            if [ "$MIN_SCORE" -gt 0 ]; then
              echo "There is no score to compare with the minimum $MIN_SCORE."
              exit 1
            fi
            exit 0
          fi
          if [ "$SCORE" -lt "$MIN_SCORE" ]; then
            echo "Governance score $SCORE is below minimum $MIN_SCORE"
            exit 1
          fi

      # Last, with continue-on-error: a failed upload skips no other step and
      # does not fail the job.
      - name: Keep scan result
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: governance-scan-result
          path: scan-result.json
          if-no-files-found: warn
